<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
<title>NguonPhim — Xem phim online miễn phí, chất lượng HD</title>
<meta name="description" content="Xem phim online miễn phí: phim mới cập nhật, phim bộ, phim lẻ, theo thể loại, quốc gia và năm phát hành. Vietsub + lồng tiếng, chất lượng HD." />
<meta property="og:type" content="website" />
<meta property="og:title" content="NguonPhim — Xem phim online miễn phí, chất lượng HD" />
<meta property="og:description" content="Kho phim khổng lồ: phim mới, phim bộ, phim lẻ, theo thể loại, quốc gia và năm." />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
<style>
  :root{
    --bg:#07080c; --bg-soft:#0f1218; --card:#12151d; --card-2:#171b26; --line:#1f2430; --line-2:#2a3040;
    --fg:#f1f3f8; --muted:#8792a8; --muted-2:#5c6478; --brand:#f5b301; --brand-soft:#ffcb4d; --brand-2:#ff5a5f;
    --radius:12px;
    --shadow-lg:0 20px 50px -12px rgba(0,0,0,.6);
    --shadow-md:0 10px 28px -8px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  a,button,select,input,.card,.chip{-webkit-touch-callout:none}
  button,a{-webkit-user-select:none;user-select:none}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  img{content-visibility:auto}
  html,body{margin:0;padding:0}
  html{
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  html::-webkit-scrollbar{display:none}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(245,179,1,.05), transparent 60%),
      radial-gradient(1000px 500px at 90% 0%, rgba(255,90,95,.04), transparent 55%),
      var(--bg);
    color:var(--fg); min-height:100vh;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    touch-action:pan-x pan-y;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button,input,select{font-family:inherit}
  .wrap{max-width:1320px;margin:0 auto;padding:0 18px}

  /* ---------- Header ---------- */
  header.site{
    position:sticky;top:0;z-index:80;
    background:rgba(7,8,12,.82);backdrop-filter:blur(16px) saturate(140%);
    border-bottom:1px solid var(--line);
  }
  .bar{display:flex;align-items:center;gap:12px;height:64px}

  .hamburger{
    width:40px;height:40px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg-soft);color:var(--fg);cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .hamburger:hover{border-color:var(--brand);color:var(--brand);background:rgba(245,179,1,.08)}

  .logo{font-weight:800;font-size:21px;letter-spacing:-.2px;white-space:nowrap;display:flex;align-items:center;flex-shrink:0}
  .logo span.hl{color:var(--brand)}

  nav.main{display:flex;gap:2px;flex:1;overflow:auto;scrollbar-width:none}
  nav.main::-webkit-scrollbar{display:none}
  nav.main a{
    padding:8px 13px;border-radius:999px;font-size:13.5px;color:var(--muted);
    white-space:nowrap;transition:.15s;font-weight:500;
  }
  nav.main a:hover{color:var(--fg);background:var(--bg-soft)}
  nav.main a.active{color:#0b0c10;background:linear-gradient(135deg,var(--brand),var(--brand-soft));font-weight:700}

  /* ---------- Search (icon -> expandable) ---------- */
  .search-wrap{position:relative;flex-shrink:0}
  .search-btn{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:var(--bg-soft);color:var(--fg);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:.15s;
  }
  .search-btn:hover{border-color:var(--brand);color:var(--brand)}
  .search-panel{
    position:absolute;right:0;top:50px;width:340px;max-width:88vw;
    background:var(--card-2);border:1px solid var(--line-2);border-radius:16px;
    box-shadow:var(--shadow-lg);padding:12px;
    opacity:0;visibility:hidden;transform:translateY(-8px);
    transition:.16s ease;z-index:90;
  }
  .search-panel.open{opacity:1;visibility:visible;transform:translateY(0)}
  .search-panel form{display:flex;align-items:center;gap:6px;background:var(--bg-soft);
    border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 15px}
  .search-panel input{background:none;border:0;outline:0;color:var(--fg);width:100%;font-size:14px}
  .search-panel button{border:0;background:linear-gradient(135deg,var(--brand),var(--brand-soft));color:#0b0c10;font-weight:700;
    border-radius:999px;padding:8px 15px;cursor:pointer;font-size:13px;flex-shrink:0}
  .search-suggest{margin-top:8px;max-height:360px;overflow:auto}
  .sg-item{display:flex;gap:10px;align-items:center;padding:7px 6px;border-radius:9px;transition:.12s}
  .sg-item:hover{background:var(--bg-soft)}
  .sg-thumb{width:36px;height:50px;border-radius:6px;overflow:hidden;background:#0e1119;flex-shrink:0}
  .sg-thumb img{width:100%;height:100%;object-fit:cover}
  .sg-info h4{margin:0;font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sg-info small{color:var(--muted);font-size:11px}
  .sg-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:14px 0}
  .sg-loading{color:var(--muted);font-size:12.5px;text-align:center;padding:14px 0}

  /* ---------- Sidebar (hamburger menu) ---------- */
  .sidebar-overlay{
    position:fixed;inset:0;background:rgba(4,5,8,.6);backdrop-filter:blur(2px);
    z-index:120;opacity:0;visibility:hidden;transition:.22s ease;
  }
  .sidebar-overlay.open{opacity:1;visibility:visible}
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;width:320px;max-width:86vw;
    background:linear-gradient(180deg,var(--card-2),var(--bg-soft));
    border-right:1px solid var(--line-2);z-index:130;
    transform:translateX(-100%);transition:.26s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto;box-shadow:var(--shadow-lg);
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-head{display:flex;align-items:center;justify-content:space-between;
    padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .sidebar-close{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg-soft);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .sidebar-close:hover{color:var(--brand);border-color:var(--brand)}
  .sb-section{border-bottom:1px solid var(--line)}
  .sb-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;
    background:none;border:0;color:var(--fg);padding:15px 18px;cursor:pointer;font-size:14.5px;font-weight:600;text-align:left}
  .sb-toggle:hover{background:rgba(255,255,255,.03)}
  .sb-toggle .chev{color:var(--muted);transition:.2s;flex-shrink:0}
  .sb-toggle.open .chev{transform:rotate(180deg);color:var(--brand)}
  .sb-toggle .sb-ic{color:var(--brand);margin-right:10px;flex-shrink:0}
  .sb-toggle .sb-left{display:flex;align-items:center}
  .sb-body{max-height:0;overflow:hidden;transition:max-height .25s ease;background:rgba(0,0,0,.15)}
  .sb-body.open{max-height:600px;overflow-y:auto}
  .sb-list{display:flex;flex-wrap:wrap;gap:7px;padding:6px 18px 16px}
  .sb-list a{font-size:12.5px;padding:6px 12px;border-radius:8px;background:var(--bg-soft);
    border:1px solid var(--line);color:var(--muted);transition:.12s}
  .sb-list a:hover{color:var(--fg);border-color:var(--brand);background:rgba(245,179,1,.08)}
  .sb-direct{display:flex;align-items:center;padding:14px 18px;font-size:14.5px;font-weight:600;color:var(--fg)}
  .sb-direct:hover{background:rgba(255,255,255,.03);color:var(--brand)}
  .sb-direct .sb-ic{color:var(--brand);margin-right:10px;flex-shrink:0;display:flex}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;margin:22px 0 8px;border-radius:22px;overflow:hidden;
    min-height:420px;background:var(--card);border:1px solid var(--line);
    box-shadow:var(--shadow-lg);
  }
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
  .hero .hgrad{position:absolute;inset:0;background:linear-gradient(90deg,#07080c 15%,rgba(7,8,12,.45) 60%,rgba(7,8,12,.92)),linear-gradient(0deg,#07080c 0%,transparent 45%)}
  .hero .hinner{position:relative;padding:52px 34px;max-width:640px}
  .hero .hactions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
  .hero .hactions .btn{margin-top:0}
  .hero h1{font-size:38px;line-height:1.12;margin:8px 0 12px;letter-spacing:-.5px;
    text-shadow:0 4px 24px rgba(0,0,0,.5)}
  .hero p{color:#d5dbe9;font-size:14.5px;line-height:1.7;max-height:92px;overflow:hidden}
  .kicker{display:inline-flex;align-items:center;gap:6px;color:#0b0c10;font-weight:800;font-size:11.5px;
    letter-spacing:1.5px;text-transform:uppercase;background:linear-gradient(135deg,var(--brand),var(--brand-soft));
    padding:5px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(245,179,1,.3)}
  .kicker svg{flex-shrink:0}
  .hero-genres{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .hero-genres span{font-size:11.5px;color:var(--muted);border:1px solid var(--line-2);padding:4px 10px;border-radius:999px;
    background:rgba(255,255,255,.03)}
  .btn{display:inline-flex;align-items:center;gap:7px;margin-top:20px;background:linear-gradient(135deg,var(--brand-2),#ff7a7f);color:#fff;
    font-weight:700;padding:13px 26px;border-radius:12px;font-size:14.5px;cursor:pointer;border:0;
    box-shadow:0 8px 24px -6px rgba(255,90,95,.5);transition:.18s;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px -6px rgba(255,90,95,.6)}
  .btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line-2);color:var(--fg);box-shadow:none;backdrop-filter:blur(6px)}
  .btn.ghost:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}

  /* ---------- Sections & cards ---------- */
  section{margin:38px 0}
  .shead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
  .shead h2{font-size:19px;margin:0;position:relative;padding-left:14px;font-weight:700;letter-spacing:-.2px}
  .shead h2::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:3px;
    background:linear-gradient(180deg,var(--brand),var(--brand-2))}
  .shead a{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;transition:.15s}
  .shead a:hover{color:var(--brand)}
  .shead a svg{flex-shrink:0;transition:transform .15s}
  .shead a:hover svg{transform:translateX(2px)}

  .rowscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
  .rowscroll::-webkit-scrollbar{display:none}
  .rowscroll .card{flex:0 0 132px;scroll-snap-align:start}

  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
  section{content-visibility:auto;contain-intrinsic-size:auto 420px}
  .grid.dense{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
    display:block;position:relative;contain:layout paint}
  .card:hover{transform:translateY(-5px);border-color:var(--brand);box-shadow:var(--shadow-md)}
  .thumb{position:relative;aspect-ratio:2/3;background:#0b0d13;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
  .card:hover .thumb img{transform:scale(1.06)}
  .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55) 0%,transparent 40%);
    opacity:0;transition:opacity .2s}
  .card:hover .thumb::after{opacity:1}
  .play-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .2s;pointer-events:none}
  .card:hover .play-hint{opacity:1}
  .play-hint svg{width:34px;height:34px;color:#fff;filter:drop-shadow(0 3px 10px rgba(0,0,0,.6))}
  .badge{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.8);
    color:var(--brand);font-size:9.5px;font-weight:800;padding:2.5px 6px;border-radius:5px;letter-spacing:.3px}
  .badge.trailer{background:linear-gradient(135deg,var(--brand-2),#ff7a7f);color:#fff}
  .eps{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.8);
    font-size:9.5px;padding:2.5px 6px;border-radius:5px;color:#e6ecf7}
  .cbody{padding:8px 8px 10px}
  .cbody h3{font-size:12px;margin:0 0 2px;line-height:1.32;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cbody small{color:var(--muted);font-size:10.5px;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- Filter (collapsible chip-style, used in category chip rows) ---------- */
  .filter-box{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:24px;overflow:hidden;box-shadow:var(--shadow-md)}
  .filter-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;
    background:none;border:0;color:var(--fg);padding:16px 18px;cursor:pointer;font-size:14.5px;font-weight:700}
  .filter-toggle .ft-left{display:flex;align-items:center;gap:10px}
  .filter-toggle .ft-icon{color:var(--brand);display:flex}
  .filter-toggle .chev{transition:.2s;color:var(--muted)}
  .filter-toggle.open .chev{transform:rotate(180deg);color:var(--brand)}
  .filter-body{max-height:0;overflow:hidden;transition:max-height .25s ease}
  .filter-body.open{max-height:700px}
  .filter-body-inner{padding:2px 18px 18px}
  .filter-group{margin-bottom:14px}
  .filter-group:last-child{margin-bottom:0}
  .filter-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:9px;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;padding:8px 15px;border-radius:10px;background:var(--bg-soft);
    border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:.14s;font-weight:500}
  .chip:hover{color:var(--fg);border-color:var(--line-2);background:var(--card-2)}
  .chip.active{color:#0b0c10;background:linear-gradient(135deg,var(--brand),var(--brand-soft));border-color:var(--brand);font-weight:700;box-shadow:0 3px 12px rgba(245,179,1,.3)}

  /* ---------- Filter bar (new: Sort/Format/Genre/Year/Country + Apply) ---------- */
  .filterbar{background:linear-gradient(160deg,var(--card-2),var(--card));border:1px solid var(--line-2);
    border-radius:16px;margin-bottom:24px;overflow:hidden;box-shadow:var(--shadow-md)}
  .filterbar-head{display:flex;align-items:center;justify-content:space-between;width:100%;
    background:none;border:0;color:var(--fg);padding:16px 18px;cursor:pointer}
  .filterbar-head .fh-left{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
  .filterbar-head .fh-icon{color:var(--brand);display:flex}
  .filterbar-head .chev{transition:.2s;color:var(--muted)}
  .filterbar-head.open .chev{transform:rotate(180deg);color:var(--brand)}
  .filterbar-body{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .filterbar-body.open{max-height:500px}
  .filterbar-inner{padding:4px 18px 18px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
  .fb-field{display:flex;flex-direction:column;gap:7px;min-width:0}
  .fb-field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .fb-select{position:relative;min-width:0}
  .fb-select select{
    width:100%;appearance:none;-webkit-appearance:none;background:var(--bg-soft);
    border:1px solid var(--line-2);color:var(--fg);padding:10px 34px 10px 13px;
    border-radius:10px;font-size:13.5px;cursor:pointer;transition:.15s;font-weight:500;
    text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
  }
  .fb-select select:hover{border-color:var(--brand)}
  .fb-select select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(245,179,1,.15)}
  .fb-select::after{content:"";position:absolute;right:12px;top:50%;transform:translateY(-50%);
    width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
    transform:translateY(-65%) rotate(45deg);pointer-events:none}
  .fb-apply{grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:4px}
  .fb-apply button{
    background:linear-gradient(135deg,var(--brand),var(--brand-soft));color:#0b0c10;border:0;
    font-weight:800;padding:11px 26px;border-radius:10px;font-size:13.5px;cursor:pointer;
    box-shadow:0 6px 20px -4px rgba(245,179,1,.4);transition:.15s;
  }
  .fb-apply button:hover{transform:translateY(-2px);box-shadow:0 10px 26px -4px rgba(245,179,1,.5)}
  @media(max-width:1080px){
    .filterbar-inner{grid-template-columns:repeat(3,minmax(0,1fr))}
  }
  @media(max-width:640px){
    .filterbar-inner{grid-template-columns:repeat(2,minmax(0,1fr))}
    .fb-apply button{width:100%;justify-content:center}
  }
  @media(max-width:420px){
    .filterbar-inner{grid-template-columns:1fr}
  }

  /* ---------- Filter panel (professional) ---------- */
  .fp{background:linear-gradient(165deg,var(--card-2),var(--card));border:1px solid var(--line-2);
    border-radius:18px;margin:20px 0 24px;overflow:hidden;box-shadow:var(--shadow-md)}
  .fp-head{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--fg);
    padding:15px 18px;cursor:pointer;text-align:left}
  .fp-head .fp-ic{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(245,179,1,.18),rgba(255,90,95,.10));color:var(--brand)}
  .fp-head .fp-t{flex:1;min-width:0}
  .fp-head .fp-t b{display:block;font-size:15px;font-weight:700;letter-spacing:-.2px}
  .fp-head .fp-t span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fp-head .chev{color:var(--muted);transition:transform .22s ease,color .2s;flex-shrink:0}
  .fp-head.open .chev{transform:rotate(180deg);color:var(--brand)}
  .fp-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.2,.8,.2,1)}
  .fp-body.open{max-height:620px}
  .fp-inner{display:grid;grid-template-columns:190px 1fr;border-top:1px solid var(--line)}
  .fp-tabs{display:flex;flex-direction:column;gap:2px;padding:12px;border-right:1px solid var(--line);
    background:rgba(0,0,0,.18)}
  .fp-tab{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:1px solid transparent;
    color:var(--muted);font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.14s;text-align:left}
  .fp-tab:hover{color:var(--fg);background:rgba(255,255,255,.04)}
  .fp-tab.active{color:var(--fg);background:var(--card-2);border-color:var(--line-2)}
  .fp-tab .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);opacity:0;flex-shrink:0;transition:.15s}
  .fp-tab.has .dot{opacity:1}
  .fp-panes{padding:16px 18px;min-height:210px;max-height:330px;overflow-y:auto}
  .fp-pane{display:none}
  .fp-pane.active{display:block}
  .fp-pane-title{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:11px}
  .fp-opts{display:flex;flex-wrap:wrap;gap:8px}
  .fp-opt{font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--bg-soft);color:var(--muted);cursor:pointer;transition:border-color .14s,color .14s,background .14s}
  .fp-opt:hover{color:var(--fg);border-color:var(--line-2);background:var(--card-2)}
  .fp-opt.on{color:#0b0c10;background:linear-gradient(135deg,var(--brand),var(--brand-soft));
    border-color:var(--brand);box-shadow:0 3px 12px -2px rgba(245,179,1,.35)}
  .fp-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 18px;border-top:1px solid var(--line);
    background:rgba(0,0,0,.2)}
  .fp-sum{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
  .fp-sum span{font-size:11.5px;white-space:nowrap;font-weight:600;color:var(--fg);background:var(--bg-soft);
    border:1px solid var(--line-2);border-radius:999px;padding:5px 11px}
  .fp-sum .none{color:var(--muted);background:none;border:0;padding:5px 0}
  .fp-btn{border:1px solid var(--line-2);background:var(--bg-soft);color:var(--muted);font-weight:700;font-size:13px;
    padding:10px 18px;border-radius:10px;cursor:pointer;transition:.15s}
  .fp-btn:hover{color:var(--fg);border-color:var(--brand)}
  .fp-btn.primary{border:0;color:#0b0c10;background:linear-gradient(135deg,var(--brand),var(--brand-soft));
    box-shadow:0 6px 18px -6px rgba(245,179,1,.5)}
  .fp-btn.primary:active{transform:translateY(1px)}
  @media(max-width:760px){
    .fp-inner{grid-template-columns:1fr}
    .fp-tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none}
    .fp-tabs::-webkit-scrollbar{display:none}
    .fp-tab{white-space:nowrap}
    .fp-panes{max-height:260px}
    .fp-btn{flex:1}
    .fp-sum{flex:1 0 100%;order:-1}
  }

  /* ---------- Theater (watch) page: chỉ player + tập ---------- */
  body.theater footer.site{display:none}
  .theater-shell{padding:14px 0 40px}
  .theater-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .tt-back,.tt-ext{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);
    background:var(--bg-soft);border:1px solid var(--line);padding:9px 14px;border-radius:10px;transition:.14s;flex-shrink:0}
  .tt-back:hover,.tt-ext:hover{color:var(--brand);border-color:var(--brand)}
  .tt-title{flex:1;min-width:0;text-align:center}
  .tt-title b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt-title span{display:block;font-size:11.5px;color:var(--muted)}
  .stage{position:relative;aspect-ratio:16/9;width:100%;background:#000;border:1px solid var(--line-2);
    border-radius:16px;overflow:hidden;box-shadow:var(--shadow-lg)}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ep-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
  .ep-nav button{display:inline-flex;align-items:center;gap:6px;background:var(--bg-soft);border:1px solid var(--line);
    color:var(--fg);font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer;transition:.14s}
  .ep-nav button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .ep-nav button:disabled{opacity:.35;cursor:not-allowed}
  .ep-nav .now{font-size:12px;color:var(--muted);text-align:center;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .epbox{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .epbox-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .epbox-head b{font-size:14px;font-weight:700}
  .epbox-head .cnt{font-size:11.5px;color:var(--muted)}
  .epbox-head input{margin-left:auto;background:var(--bg-soft);border:1px solid var(--line);border-radius:9px;
    color:var(--fg);font-size:12.5px;padding:8px 12px;width:130px;outline:none;transition:.14s}
  .epbox-head input:focus{border-color:var(--brand)}
  .epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;padding:14px 16px;
    max-height:340px;overflow-y:auto}
  .epgrid a{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;
    padding:10px 6px;border-radius:9px;background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
    transition:border-color .14s,color .14s,background .14s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .epgrid a:hover{color:var(--fg);border-color:var(--line-2);background:var(--card-2)}
  .epgrid a.active{color:#0b0c10;background:linear-gradient(135deg,var(--brand),var(--brand-soft));
    border-color:var(--brand);font-weight:800}
  .epgrid a.hide{display:none}

  /* ---------- Stats dashboard ---------- */
  .stats{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));margin:22px 0 6px}
  .stat{
    position:relative;background:linear-gradient(160deg,var(--card-2),var(--card));
    border:1px solid var(--line-2);border-radius:16px;padding:16px 16px;
    display:flex;align-items:center;gap:12px;overflow:hidden;box-shadow:var(--shadow-md);
    transition:transform .2s,border-color .2s;min-width:0;
  }
  .stat:hover{transform:translateY(-3px);border-color:var(--brand)}
  .stat::before{content:"";position:absolute;top:-30%;right:-20%;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,rgba(245,179,1,.12),transparent 70%);pointer-events:none}
  .stat .stat-ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,rgba(245,179,1,.18),rgba(255,90,95,.1));
    color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1}
  .stat .stat-txt{min-width:0}
  .stat b{display:block;font-size:20px;color:var(--fg);letter-spacing:.2px;font-weight:800;position:relative;z-index:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat span{font-size:11.5px;color:var(--muted);position:relative;z-index:1;font-weight:500;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:760px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media(max-width:380px){ .stats{grid-template-columns:1fr} }

  /* ---------- Detail / Intro page ---------- */
  .detail{display:grid;grid-template-columns:minmax(200px,290px) minmax(0,1fr);gap:32px;margin-top:22px}
  .detail .poster{border-radius:16px;overflow:hidden;border:1px solid var(--line);position:relative;box-shadow:var(--shadow-lg)}
  .detail .poster img{width:100%}
  .meta{list-style:none;padding:0;margin:16px 0 0;font-size:14px;color:var(--muted);line-height:2}
  .meta b{color:var(--fg);font-weight:600}
  .desc{color:#c9d2e2;font-size:14.5px;line-height:1.8}
  .genre-tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  .genre-tags span{font-size:12px;background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);padding:6px 13px;border-radius:999px;font-weight:500}
  .action-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
  .action-row .btn{margin-top:0}
  .back-link{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13.5px;margin-bottom:16px;transition:.15s}
  .back-link:hover{color:var(--brand)}
  .back-link svg{flex-shrink:0}

  /* ---------- Cinema Player ---------- */
  .cinema-wrap{background:linear-gradient(180deg,#000 0%,#05060a 100%);border-radius:20px;
    border:1px solid var(--line-2);overflow:hidden;margin-bottom:20px;box-shadow:var(--shadow-lg)}
  .player{aspect-ratio:16/9;width:100%;background:#000;position:relative}
  .player iframe{width:100%;height:100%;border:0}
  .player-info{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);
    border-top:1px solid var(--line);flex-wrap:wrap}
  .player-info .pi-left{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .player-info .pi-left b{color:var(--fg);font-weight:700}
  .player-info a.ext{color:var(--brand);font-size:12.5px;display:flex;align-items:center;gap:6px}
  .player-info a.ext:hover{color:var(--brand-soft)}
  .player-info a.ext svg{flex-shrink:0}

  .epwrap{max-height:300px;overflow:auto;padding-right:4px}
  .eplist{display:flex;flex-wrap:wrap;gap:8px}
  .eplist a{background:var(--bg-soft);border:1px solid var(--line);border-radius:9px;
    padding:9px 15px;font-size:13px;color:var(--muted);min-width:48px;text-align:center;font-weight:600;transition:.14s}
  .eplist a:hover{border-color:var(--brand);color:var(--fg)}
  .eplist a.active{background:linear-gradient(135deg,var(--brand),var(--brand-soft));color:#0b0c10;border-color:var(--brand);font-weight:800;box-shadow:0 4px 14px rgba(245,179,1,.3)}

  /* ---------- Pager ---------- */
  .pager{display:flex;gap:6px;justify-content:center;align-items:center;margin:30px 0 6px;flex-wrap:wrap}
  .pager button{background:var(--bg-soft);border:1px solid var(--line);color:var(--fg);
    min-width:40px;height:40px;padding:0 10px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
  .pager button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .pager button:disabled{opacity:.3;cursor:not-allowed}
  .pager button.num.active{background:linear-gradient(135deg,var(--brand),var(--brand-soft));border-color:var(--brand);color:#0b0c10;font-weight:800}
  .pager button.dots{border:0;background:none;color:var(--muted-2);cursor:default;padding:0 2px;min-width:24px;display:inline-flex;align-items:center;justify-content:center}
  .pager button.arrow{color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
  .pager-info{text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px}

  .skel{background:linear-gradient(90deg,#151925,#1d2231,#151925);
    background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--radius);aspect-ratio:2/3}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .empty{color:var(--muted);text-align:center;padding:50px 0}

  /* ---------- Toast ---------- */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--card-2);border:1px solid var(--line-2);color:var(--fg);
    padding:13px 22px;border-radius:14px;font-size:14px;box-shadow:var(--shadow-lg);
    opacity:0;visibility:hidden;transition:.22s ease;z-index:200;display:flex;align-items:center;gap:9px}
  .toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  .toast .t-ic{color:var(--brand-2);flex-shrink:0}

  /* ---------- Footer ---------- */
  footer.site{border-top:1px solid var(--line);margin-top:60px;padding:0;color:var(--muted);font-size:13px}
  .footer-flag-bar{background:linear-gradient(135deg,rgba(255,77,79,.12),rgba(255,77,79,.03));
    border-bottom:1px solid var(--line);padding:16px 0}
  .footer-flag{display:flex;align-items:center;justify-content:center;gap:10px;color:#ff5457;font-weight:800;font-size:15.5px;text-align:center}
  .footer-flag .flag{font-size:21px;line-height:1}
  .footer-body{padding:36px 0 30px;text-align:center}
  .footer-top{max-width:560px;margin:0 auto}
  .footer-logo{font-weight:800;font-size:20px;display:inline-flex;align-items:center;justify-content:center}
  .footer-logo span.hl{color:var(--brand)}
  .footer-tagline{margin:14px 0 0;font-size:13.5px;line-height:1.75;color:var(--muted)}
  .footer-copy{font-size:12.5px;color:var(--muted-2);margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}

  /* ---------- Telegram footer ---------- */
  .footer-social{display:flex;justify-content:center;margin-top:18px}
  .tg-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#229ED9,#37b6ec);
    color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px;
    box-shadow:0 8px 22px -8px rgba(34,158,217,.7);transition:.16s}
  .tg-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px -8px rgba(34,158,217,.85);color:#fff}
  .tg-btn svg{flex-shrink:0}

  /* ---------- Boot loading screen ---------- */
  #boot{position:fixed;inset:0;z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(900px 500px at 50% 20%,rgba(245,179,1,.07),transparent 65%),var(--bg);
    transition:opacity .35s ease,visibility .35s ease}
  #boot.hide{opacity:0;visibility:hidden;pointer-events:none}
  #boot .bl-logo{font-weight:800;font-size:27px;letter-spacing:-.4px}
  #boot .bl-logo span{color:var(--brand)}
  #boot .bl-ring{width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.08);
    border-top-color:var(--brand);border-right-color:var(--brand-2);animation:blspin .8s linear infinite}
  @keyframes blspin{to{transform:rotate(360deg)}}
  #boot .bl-txt{font-size:12.5px;color:var(--muted);letter-spacing:.4px}
  #boot .bl-bar{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
  #boot .bl-bar i{display:block;height:100%;width:38%;border-radius:3px;
    background:linear-gradient(90deg,var(--brand),var(--brand-2));animation:blbar 1.1s ease-in-out infinite}
  @keyframes blbar{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}

  /* route loading bar */
  #routebar{position:fixed;left:0;top:0;height:2.5px;width:0;z-index:300;
    background:linear-gradient(90deg,var(--brand),var(--brand-2));box-shadow:0 0 12px rgba(245,179,1,.7);
    opacity:0;transition:width .25s ease,opacity .25s ease}
  #routebar.on{opacity:1}

  /* ---------- Floating back-home button ---------- */
  .home-fab{position:fixed;right:14px;top:76px;z-index:70;display:inline-flex;align-items:center;gap:7px;
    padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--fg);
    background:rgba(18,21,29,.55);border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
    box-shadow:0 10px 26px -12px rgba(0,0,0,.8);opacity:.72;transition:.18s}
  .home-fab:hover{opacity:1;color:var(--brand);border-color:var(--brand);transform:translateY(-1px)}
  .home-fab svg{flex-shrink:0}
  @media(max-width:640px){ .home-fab{right:10px;top:72px;padding:8px 12px;font-size:12.5px} .home-fab .hf-t{display:none} }

  /* ---------- Watch page: movie info ---------- */
  .winfo{margin-top:18px;background:linear-gradient(160deg,var(--card-2),var(--card));border:1px solid var(--line-2);
    border-radius:16px;padding:16px;display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;box-shadow:var(--shadow-md)}
  .winfo .wposter{border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:2/3;background:#0b0d13}
  .winfo .wposter img{width:100%;height:100%;object-fit:cover}
  .winfo h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
  .winfo .worig{color:var(--muted);font-size:12.5px;margin-top:3px}
  .winfo .wtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .winfo .wtags span{font-size:11.5px;padding:4px 10px;border-radius:999px;background:var(--bg-soft);
    border:1px solid var(--line);color:var(--muted);font-weight:600}
  .winfo .wtags span.hi{color:#0b0c10;background:linear-gradient(135deg,var(--brand),var(--brand-soft));border-color:var(--brand)}
  .winfo .wdesc{margin-top:11px;font-size:13px;line-height:1.75;color:#c2cbdb;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .winfo .wdesc.open{-webkit-line-clamp:unset;display:block}
  .winfo .wmore{background:none;border:0;color:var(--brand);font-size:12.5px;font-weight:700;cursor:pointer;padding:6px 0}
  .winfo .wrows{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 16px}
  .winfo .wrows div{font-size:12.5px;color:var(--muted);line-height:1.9;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .winfo .wrows b{color:var(--fg);font-weight:600}
  .winfo .wact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .winfo .wact a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
    padding:9px 14px;border-radius:10px;background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);transition:.14s}
  .winfo .wact a:hover{color:var(--brand);border-color:var(--brand)}
  @media(max-width:560px){ .winfo{grid-template-columns:84px minmax(0,1fr);gap:12px;padding:13px} .winfo h1{font-size:16.5px} }

  /* ---------- Watch info: gọn gàng, chuyên nghiệp ---------- */
  .winfo{margin-top:16px;grid-template-columns:120px minmax(0,1fr);gap:18px;padding:18px;border-radius:18px;
    align-items:start;background:linear-gradient(150deg,rgba(255,255,255,.035),transparent 55%),var(--card)}
  .winfo .wposter{position:sticky;top:80px}
  .winfo .wtags span{font-size:11px;padding:3px 9px}
  .winfo .wdesc{-webkit-line-clamp:4;color:#b8c1d2;font-size:12.8px;margin-top:10px}
  .winfo .wrows{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px 14px}
  .winfo .wrows div{font-size:12px;line-height:1.85}
  .winfo .wact{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .winfo .wact a{padding:8px 13px;font-size:12px;border-radius:9px}
  @media(min-width:900px){ .winfo{max-width:960px} }
  @media(max-width:560px){
    .winfo{grid-template-columns:92px minmax(0,1fr);gap:13px;padding:14px;border-radius:14px}
    .winfo .wposter{position:static}
    .winfo .wrows{grid-template-columns:1fr}
    .winfo .wact a{flex:1;justify-content:center}
  }

  /* ---------- Bộ lọc: mượt hơn ---------- */
  .fp-body{transition:max-height .2s ease-out;contain:content}
  .fp-panes{will-change:scroll-position;transform:translateZ(0)}
  .fp-opt{transition:background-color .1s linear,color .1s linear,border-color .1s linear;
    box-shadow:none;contain:layout style}
  .fp-opt.on{box-shadow:none}
  .fp-tab{transition:background-color .1s linear,color .1s linear}

  /* ---------- Filter smoothness ---------- */
  .fp-body{will-change:max-height;contain:paint}
  .fp-panes{contain:content;-webkit-overflow-scrolling:touch}
  .fp-opt{will-change:auto;transition:background-color .12s linear,color .12s linear,border-color .12s linear}
  .fp-opt:active{transform:scale(.97)}
  .fp-head{touch-action:manipulation}

  @media(max-width:860px){
    .detail{grid-template-columns:1fr}
    .detail .poster{max-width:230px}
    .hero h1{font-size:26px}
    .hero .hinner{padding:28px 20px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
    .grid.dense{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
    .rowscroll .card{flex:0 0 110px}
    .search-panel{right:-50px}
    .footer-main{flex-direction:column;text-align:center}
  }

  /* ---------- Watch page: movie card v2 ---------- */
  .wcard{margin-top:18px;border:1px solid var(--line-2);border-radius:20px;overflow:hidden;
    background:linear-gradient(180deg,var(--card-2),var(--card));box-shadow:var(--shadow-lg)}
  .wc-hero{position:relative;padding:22px 20px;overflow:hidden}
  .wc-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(26px) saturate(130%);transform:scale(1.2);opacity:.45}
  .wc-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,8,12,.55),rgba(7,8,12,.94))}
  .wc-hero-in{position:relative;z-index:2;display:flex;gap:16px;align-items:flex-end}
  .wc-poster{width:108px;flex-shrink:0;aspect-ratio:2/3;border-radius:14px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 34px -10px rgba(0,0,0,.8);background:#0b0d13}
  .wc-poster img{width:100%;height:100%;object-fit:cover}
  .wc-head{min-width:0}
  .wc-now{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:#0b0c10;
    background:linear-gradient(135deg,var(--brand),var(--brand-soft));padding:4px 10px;border-radius:999px;margin-bottom:8px}
  .wc-head h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
  .wc-orig{color:var(--muted);font-size:12.5px;margin-top:4px}
  .wc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .wc-tags span{font-size:11.5px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);color:#d6dcea;font-weight:600}
  .wc-tags span.hi{background:rgba(245,179,1,.16);border-color:rgba(245,179,1,.45);color:var(--brand)}
  .wc-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
  .wc-stat{padding:11px 14px;min-width:0;border-right:1px solid var(--line)}
  .wc-stat:last-child{border-right:0}
  .wc-stat span{display:block;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted-2);font-weight:700}
  .wc-stat b{display:block;margin-top:3px;font-size:13px;font-weight:700;color:var(--fg);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wc-body{padding:16px 18px 18px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
  .wc-sec h3{margin:0 0 8px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:.2px}
  .wc-sec h3 i{width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--brand),var(--brand-2))}
  .wcard .wdesc{font-size:13px;line-height:1.8;color:#c2cbdb;
    display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .wcard .wdesc.open{-webkit-line-clamp:unset;display:block}
  .wcard .wmore{background:none;border:0;color:var(--brand);font-size:12.5px;font-weight:700;cursor:pointer;padding:6px 0}
  .wc-rows div{display:flex;gap:10px;font-size:12.5px;line-height:1.7;padding:7px 0;border-bottom:1px dashed var(--line)}
  .wc-rows div:last-child{border-bottom:0}
  .wc-rows span{flex:0 0 76px;color:var(--muted-2);font-weight:700}
  .wc-rows b{font-weight:600;color:#d6dcea;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .wc-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .wc-act a{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:700;
    padding:9px 13px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-soft);color:var(--fg);transition:.15s}
  .wc-act a:hover{color:var(--brand);border-color:var(--brand)}
  @media(max-width:780px){
    .wc-body{grid-template-columns:1fr;gap:16px}
    .wc-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
    .wc-stat:nth-child(2){border-right:0}
    .wc-stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  }
  @media(max-width:560px){

  /* today's updates row */
  .today-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#0b0c10;
    background:linear-gradient(135deg,var(--brand),var(--brand-soft));padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
</style>

<script>
const API = "https://phim.nguonc.com/api";
const PAGE_SIZE = 15;
const $ = (s,r=document)=>r.querySelector(s);
const app = $("#app");
document.getElementById("yr").textContent = new Date().getFullYear();

/* ---------- Inline icon set (no keyboard/emoji glyphs) ---------- */
const CHEV_DOWN = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
const ARROW_LEFT = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`;
const ARROW_RIGHT = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;
const DOTS_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>`;
const STAR_ICON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.1 6.7.9-4.9 4.6 1.3 6.6L12 17l-6 3.2 1.3-6.6-4.9-4.6 6.7-.9L12 2z"/></svg>`;
const PLAY_ICON_SM = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
const EXT_ICON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
const ARROW_RIGHT_SM = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;
const HOME_ICON = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>`;
const HOME_FAB = `<a class="home-fab" href="#/" title="Về trang chủ">${HOME_ICON}<span class="hf-t">Trang chủ</span></a>`;
document.getElementById("toastIcon").innerHTML = PLAY_ICON_SM;

const MENU = [
  {label:"Phim mới", hash:"#/list/phim-moi-cap-nhat/1"},
  {label:"Đang chiếu", hash:"#/danh-sach/dang-chieu/1"},
  {label:"Phim bộ", hash:"#/danh-sach/phim-bo/1"},
  {label:"Phim lẻ", hash:"#/danh-sach/phim-le/1"},
  {label:"TV Shows", hash:"#/danh-sach/tv-shows/1"},
  {label:"Hoạt hình", hash:"#/the-loai/hoat-hinh/1"},
];

const GENRES = [
  ["hanh-dong","Hành Động"],["phieu-luu","Phiêu Lưu"],["hoat-hinh","Hoạt Hình"],["hai-huoc","Hài"],
  ["hinh-su","Hình Sự"],["tai-lieu","Tài Liệu"],["chinh-kich","Chính Kịch"],["gia-dinh","Gia Đình"],
  ["gia-tuong","Giả Tưởng"],["lich-su","Lịch Sử"],["kinh-di","Kinh Dị"],["nhac","Nhạc"],
  ["bi-an","Bí Ẩn"],["lang-man","Lãng Mạn"],["khoa-hoc-vien-tuong","Khoa Học Viễn Tưởng"],["gay-can","Gây Cấn"],
  ["chien-tranh","Chiến Tranh"],["tam-ly","Tâm Lý"],["tinh-cam","Tình Cảm"],["co-trang","Cổ Trang"],
  ["mien-tay","Miền Tây"],["phim-18","Phim 18+"],
];
const COUNTRIES = [
  ["au-my","Âu Mỹ"],["anh","Anh"],["trung-quoc","Trung Quốc"],["indonesia","Indonesia"],
  ["viet-nam","Việt Nam"],["phap","Pháp"],["hong-kong","Hồng Kông"],["han-quoc","Hàn Quốc"],
  ["nhat-ban","Nhật Bản"],["thai-lan","Thái Lan"],["dai-loan","Đài Loan"],["nga","Nga"],
  ["ha-lan","Hà Lan"],["philippines","Philippines"],["an-do","Ấn Độ"],["quoc-gia-khac","Quốc gia khác"],
];
const YEARS = Array.from({length:11},(_,i)=>String(2026-i)); // 2026 -> 2016

$("#nav").innerHTML = MENU.map(m=>`<a href="${m.hash}">${m.label}</a>`).join("");

/* ---------- Sidebar (hamburger menu) ---------- */
const sidebar = $("#sidebar");
const sidebarOverlay = $("#sidebarOverlay");
const SB_ICONS = {
  tv:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>`,
  disc:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>`,
  layers:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`,
  flame:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>`,
  grid:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`,
  globe:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20 15.3 15.3 0 010-20z"/></svg>`,
  calendar:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
};
function sidebarSectionHTML(id, icon, title, items, prefix){
  return `<div class="sb-section">
    <button class="sb-toggle" id="${id}-btn" onclick="toggleSidebarSection('${id}')">
      <span class="sb-left"><span class="sb-ic">${icon}</span>${title}</span>
      <span class="chev">${CHEV_DOWN}</span>
    </button>
    <div class="sb-body" id="${id}-body">
      <div class="sb-list">${items.map(([s,l])=>`<a href="#${prefix}/${s}/1" onclick="closeSidebar()">${l}</a>`).join("")}</div>
    </div>
  </div>`;
}
function sbDirectHTML(href, icon, label){
  return `<a class="sb-direct" href="${href}" onclick="closeSidebar()"><span class="sb-ic">${icon}</span>${label}</a>`;
}
$("#sidebarBody").innerHTML = `
  ${sbDirectHTML("#/danh-sach/tv-shows/1", SB_ICONS.tv, "TV Shows")}
  ${sbDirectHTML("#/danh-sach/phim-le/1", SB_ICONS.disc, "Phim lẻ")}
  ${sbDirectHTML("#/danh-sach/phim-bo/1", SB_ICONS.layers, "Phim bộ")}
  ${sbDirectHTML("#/danh-sach/dang-chieu/1", SB_ICONS.flame, "Đang chiếu")}
  ${sidebarSectionHTML("sbGenre", SB_ICONS.grid, "Thể loại", GENRES, "/the-loai")}
  ${sidebarSectionHTML("sbCountry", SB_ICONS.globe, "Quốc gia", COUNTRIES, "/quoc-gia")}
  ${sidebarSectionHTML("sbYear", SB_ICONS.calendar, "Năm", YEARS.map(y=>[y,y]), "/nam-phat-hanh")}
`;
function toggleSidebarSection(id){
  const btn = document.getElementById(id+"-btn");
  const body = document.getElementById(id+"-body");
  const isOpen = body.classList.contains("open");
  body.classList.toggle("open", !isOpen);
  btn.classList.toggle("open", !isOpen);
}
function openSidebar(){ sidebar.classList.add("open"); sidebarOverlay.classList.add("open"); }
function closeSidebar(){ sidebar.classList.remove("open"); sidebarOverlay.classList.remove("open"); }
$("#menuToggle").addEventListener("click", openSidebar);
$("#sidebarClose").addEventListener("click", closeSidebar);
sidebarOverlay.addEventListener("click", closeSidebar);
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeSidebar(); });

/* ---------- Search: icon toggle + suggestions ---------- */
const searchToggle = $("#searchToggle");
const searchPanel = $("#searchPanel");
const qInput = $("#q");
const suggestBox = $("#searchSuggest");
let suggestTimer = null;

function openSearch(){
  searchPanel.classList.add("open");
  setTimeout(()=>qInput.focus(), 50);
}
function closeSearch(){
  searchPanel.classList.remove("open");
  suggestBox.innerHTML = "";
}
searchToggle.addEventListener("click", (e)=>{
  e.stopPropagation();
  searchPanel.classList.contains("open") ? closeSearch() : openSearch();
});
document.addEventListener("click", (e)=>{
  if(!searchPanel.contains(e.target) && e.target!==searchToggle) closeSearch();
});
document.addEventListener("keydown", (e)=>{
  if(e.key==="Escape") closeSearch();
});

$("#searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  const kw = qInput.value.trim();
  if(kw){ location.hash = `#/search/${encodeURIComponent(kw)}`; closeSearch(); }
});

qInput.addEventListener("input", ()=>{
  const kw = qInput.value.trim();
  clearTimeout(suggestTimer);
  if(!kw){ suggestBox.innerHTML = ""; return; }
  suggestBox.innerHTML = `<div class="sg-loading">Đang tìm…</div>`;
  suggestTimer = setTimeout(async ()=>{
    try{
      const data = await get(`${API}/films/search?keyword=${encodeURIComponent(kw)}`);
      const items = (data.items||[]).slice(0,6);
      if(!items.length){ suggestBox.innerHTML = `<div class="sg-empty">Không tìm thấy kết quả phù hợp.</div>`; return; }
      suggestBox.innerHTML = items.map(m=>`<a class="sg-item" href="#/phim/${m.slug}">
          <div class="sg-thumb"><img loading="lazy" src="${img(m)}" alt="${m.name}"/></div>
          <div class="sg-info"><h4>${m.name}</h4><small>${m.original_name||""}</small></div>
        </a>`).join("");
      suggestBox.querySelectorAll("a").forEach(a=>a.addEventListener("click",closeSearch));
    }catch(err){
      suggestBox.innerHTML = `<div class="sg-empty">Không tải được gợi ý.</div>`;
    }
  }, 320);
});

/* ---------- Helpers ---------- */
async function get(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
const img = m => m.thumb_url || m.poster_url || "";
const strip = h => (h||"").replace(/<[^>]*>/g,"").trim();
const isTrailer = m => /trailer/i.test(m.name||"") || /trailer/i.test(m.current_episode||"") || /trailer/i.test(m.slug||"");

const PLAY_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.35)"/><path d="M10 8l6 4-6 4V8z" fill="#fff"/></svg>`;

function cardHTML(m){
  const trailer = isTrailer(m);
  return `<a class="card" href="#/phim/${m.slug}">
    <div class="thumb">
      <img loading="lazy" decoding="async" src="${img(m)}" alt="Poster phim ${m.name}" />
      <div class="play-hint">${PLAY_SVG}</div>
      ${trailer ? `<span class="badge trailer">TRAILER</span>` : (m.quality?`<span class="badge">${m.quality}</span>`:"")}
      ${m.current_episode?`<span class="eps">${m.current_episode}</span>`:""}
    </div>
    <div class="cbody">
      <h3>${m.name}</h3>
      <small>${m.original_name||""}</small>
    </div>
  </a>`;
}
const skeletons = n => `<div class="grid">${Array.from({length:n},()=>'<div class="skel"></div>').join("")}</div>`;

function pager(cur,total,mk){
  if(!total || total<2) return "";
  cur=Number(cur)||1;
  let from=Math.max(1,cur-2), to=Math.min(total,from+4);
  from=Math.max(1,Math.min(from,to-4));
  let nums="";
  if(from>1){ nums+=`<button class="num" onclick="location.hash='${mk(1)}'">1</button>`; if(from>2) nums+=`<button class="dots" disabled>${DOTS_ICON}</button>`; }
  for(let i=from;i<=to;i++) nums+=`<button class="num ${i===cur?"active":""}" onclick="location.hash='${mk(i)}'">${i}</button>`;
  if(to<total){ if(to<total-1) nums+=`<button class="dots" disabled>${DOTS_ICON}</button>`; nums+=`<button class="num" onclick="location.hash='${mk(total)}'">${total}</button>`; }
  return `<div class="pager">
    <button class="arrow" ${cur<=1?"disabled":""} onclick="location.hash='${mk(cur-1)}'" aria-label="Trang trước" title="Trang trước">${ARROW_LEFT}</button>
    ${nums}
    <button class="arrow" ${cur>=total?"disabled":""} onclick="location.hash='${mk(cur+1)}'" aria-label="Trang sau" title="Trang sau">${ARROW_RIGHT}</button>
  </div>
  <div class="pager-info">Trang ${cur} / ${total}</div>`;
}

const nf = n => Number(n||0).toLocaleString("vi-VN");
const ICONS = {
  film:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="7" y1="3" x2="7" y2="21"/><line x1="17" y1="3" x2="17" y2="21"/><line x1="2" y1="9" x2="7" y2="9"/><line x1="2" y1="15" x2="7" y2="15"/><line x1="17" y1="9" x2="22" y2="9"/><line x1="17" y1="15" x2="22" y2="15"/></svg>`,
  spark:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z"/></svg>`,
  layers:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`,
  disc:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>`,

/* ---------- Phim cập nhật hôm nay (lấy thật từ API, quét nhiều trang) ---------- */
function vnDayKey(d){
  // đổi sang giờ VN (UTC+7) rồi lấy YYYY-MM-DD
  const t = new Date(d);
  if(isNaN(t)) return "";
  return new Date(t.getTime() + 7*3600*1000).toISOString().slice(0,10);
}
function itemDayKey(m){
  const raw = m?.modified?.time || m?.modified || m?.created?.time || m?.created || "";
  if(!raw) return "";
  return vnDayKey(raw);
}
async function fetchTodayUpdates(firstPage){
  const today = vnDayKey(Date.now());
  const out = [];
  let page = 1, data = firstPage, stop = false;
  while(page <= 12 && !stop){
    if(page > 1){
      try{ data = await get(`${API}/films/phim-moi-cap-nhat?page=${page}`); }
      catch(e){ break; }
    }
    const items = data?.items || [];
    if(!items.length) break;
    for(const it of items){
      const k = itemDayKey(it);
      if(k === today) out.push(it);
      else if(k && k < today){ stop = true; break; }
    }
    const tp = Number(data?.paginate?.total_page) || Infinity;
    if(page >= tp) break;
    page++;
  }
  return { items: out, count: out.length, today };
}

}

/* ---------- Lấy dữ liệu theo "trang ảo" 15 phim/trang (gộp nhiều trang API) ---------- */
const apiPageCache = new Map();
function getApiPage(base, n){
  const key = base + "|" + n;
  if(apiPageCache.has(key)) return apiPageCache.get(key);
  const pr = get(base + (base.includes("?") ? "&" : "?") + "page=" + n)
    .catch(err=>{ apiPageCache.delete(key); throw err; });
  apiPageCache.set(key, pr);
  return pr;
}
async function getVirtualPage(base, vpage){
  const first = await getApiPage(base, 1);
  const per = (first.items||[]).length || 10;
  const totalItems = Number(first.paginate?.total_items) || (first.items||[]).length;
  const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
  vpage = Math.min(Math.max(1, Number(vpage)||1), totalPages);
  const start = (vpage-1) * PAGE_SIZE;
  const fromApi = Math.floor(start / per) + 1;
  const toApi = Math.floor((start + PAGE_SIZE - 1) / per) + 1;
  const nums = [];
  for(let i=fromApi;i<=toApi;i++) nums.push(i);
  const res = await Promise.all(nums.map(n => n===1 ? Promise.resolve(first) : getApiPage(base, n).catch(()=>({items:[]}))));
  const merged = res.flatMap(r => r.items||[]);
  const offset = start - (fromApi-1) * per;
  return { items: merged.slice(offset, offset + PAGE_SIZE), totalItems, totalPages, page: vpage };
}

      <div class="tt-title"><b>${m.name}</b><span>${epName}${all.length>1?` • ${all.length} tập`:""}</span></div>
      ${cur?`<a class="tt-ext" href="${cur.embed}" target="_blank" rel="noopener">Tab mới${EXT_ICON}</a>`:""}
    </div>
    ${cur?`<div class="stage"><iframe src="${cur.embed}" allowfullscreen allow="autoplay; fullscreen; encrypted-media" title="Trình phát ${m.name}"></iframe></div>`
        :`<div class="empty">Chưa có nguồn phát cho phim này.</div>`}
    ${all.length>1?`<div class="ep-nav">
      <button ${prev?"":"disabled"} onclick="${prev?`location.hash='#/phim/${m.slug}/watch/${prev.slug}'`:""}">${ARROW_LEFT}Tập trước</button>
      <div class="now">${epName}</div>
      <button ${next?"":"disabled"} onclick="${next?`location.hash='#/phim/${m.slug}/watch/${next.slug}'`:""}">Tập sau${ARROW_RIGHT}</button>
    </div>`:""}

    ${all.length>1?`<div class="epbox">
      <div class="epbox-head">
        <b>Danh sách tập</b><span class="cnt">${all.length} tập</span>
        <input id="epFilter" placeholder="Nhập số tập" inputmode="numeric" aria-label="Tìm tập" oninput="filterEps(this.value)" />
      </div>
      <div class="epgrid" id="epGrid">
        ${all.map(e=>`<a data-n="${(isTrailer(e)?"trailer":e.name).toLowerCase()}" class="${cur&&e.slug===cur.slug?"active":""}" href="#/phim/${m.slug}/watch/${e.slug}">${isTrailer(e)?"Trailer":e.name}</a>`).join("")}
      </div>
    </div>`:""}

    <div class="wcard">
      <div class="wc-hero">
        <img class="wc-bg" loading="lazy" src="${m.poster_url||m.thumb_url||""}" alt="" aria-hidden="true" />
        <div class="wc-veil"></div>
        <div class="wc-hero-in">
          <div class="wc-poster"><img loading="lazy" src="${m.thumb_url||m.poster_url||""}" alt="Poster phim ${m.name}" /></div>
          <div class="wc-head">
            ${cur?`<div class="wc-now">${PLAY_ICON_SM}<span>Đang xem • ${epName}</span></div>`:""}
            <h1>${m.name}</h1>
            <div class="wc-orig">${m.original_name||""}</div>
            <div class="wc-tags">
              ${m.quality?`<span class="hi">${m.quality}</span>`:""}
              ${m.language?`<span>${m.language}</span>`:""}
              ${year?`<span>${year}</span>`:""}
              ${genres.slice(0,4).map(g=>`<span>${g}</span>`).join("")}
              ${countries.slice(0,2).map(c=>`<span>${c}</span>`).join("")}
            </div>
          </div>
        </div>
      </div>
      <div class="wc-strip">
        <div class="wc-stat"><span>Trạng thái</span><b>${m.current_episode||"—"}</b></div>
        <div class="wc-stat"><span>Tổng số tập</span><b>${m.total_episodes||all.length||"—"}</b></div>
        <div class="wc-stat"><span>Thời lượng</span><b>${m.time||"—"}</b></div>
        <div class="wc-stat"><span>Nguồn phát</span><b>${servers[0]?.server_name||"Đang cập nhật"}</b></div>
      </div>
      <div class="wc-body">
        <div class="wc-sec">
          <h3><i></i>Nội dung phim</h3>
          <div class="wdesc" id="wdesc">${desc}</div>
          <button class="wmore" onclick="const d=document.getElementById('wdesc');d.classList.toggle('open');this.textContent=d.classList.contains('open')?'Thu gọn':'Xem thêm';">Xem thêm</button>
        </div>
        <div class="wc-sec">
          <h3><i></i>Thông tin</h3>
          <div class="wc-rows">
            <div><span>Đạo diễn</span><b>${m.director||"Đang cập nhật"}</b></div>
            <div title="${(m.casts||"").replace(/"/g,"")}"><span>Diễn viên</span><b>${m.casts||"Đang cập nhật"}</b></div>
          </div>
          <div class="wc-act">
            <a href="#/phim/${m.slug}">${ARROW_LEFT}Trang giới thiệu</a>
            <a href="#/">${HOME_ICON}Trang chủ</a>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}
function filterEps(v){
  const kw = String(v||"").trim().toLowerCase();
  document.querySelectorAll("#epGrid a").forEach(a=>{
    a.classList.toggle("hide", !!kw && !a.dataset.n.includes(kw));
  });
}

/* ---------- Loading (boot + thanh tiến trình khi chuyển trang) ---------- */
const bootEl = document.getElementById("boot");
const rbar = document.getElementById("routebar");
let rbTimer = null;
function rbStart(){
  if(!rbar) return;
  clearTimeout(rbTimer);
  rbar.classList.add("on"); rbar.style.width = "0%";
  requestAnimationFrame(()=>{ rbar.style.width = "72%"; });
}
function rbDone(){
  if(!rbar) return;
  rbar.style.width = "100%";
  rbTimer = setTimeout(()=>{ rbar.classList.remove("on"); rbar.style.width = "0%"; }, 260);
}
function hideBoot(){
  if(!bootEl || bootEl.classList.contains("hide")) return;
  bootEl.classList.add("hide");
  setTimeout(()=>bootEl.remove(), 400);
}

/* ---------- Router ---------- */
async function route(){
  const parts = (location.hash.replace(/^#\/?/,"")||"").split("/").filter(Boolean);
  window.scrollTo(0,0);
  document.body.classList.remove("theater");
  setActiveNav();
  closeSearch();
  closeSidebar();
  rbStart();
  try{
    if(parts.length===0) await pageHome();
    else if(parts[0]==="phim") await pageDetail(parts[1], parts[2], parts[3]);
    else if(parts[0]==="search") await pageList("search", parts[1], 1);
    else if(["list","danh-sach","the-loai","quoc-gia","nam-phat-hanh"].includes(parts[0])){
      if(parts[0]==="list") await pageList("list", "", parts[2]||parts[1]||1);
      else await pageList(parts[0], parts[1], parts[2]||1);
    }
    else await pageHome();
  }catch(err){
    app.innerHTML = `<div class="empty">Không tải được dữ liệu. Vui lòng thử lại.<br><small>${err.message}</small></div>`;
  }finally{
    rbDone();
    hideBoot();
  }
}
window.addEventListener("hashchange", route);
setTimeout(hideBoot, 12000); // fallback an toàn
route();
</script>
</body>
</html>
